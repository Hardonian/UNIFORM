name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev --extra solvers
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv build
      - run: uvx twine check dist/*
      - name: Require tag and package versions to agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(uv run python -c 'import uniform_lab; print(uniform_lab.__version__)')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uniform-lab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
